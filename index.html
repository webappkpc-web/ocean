<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth POS Printer Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 25px; font-size: 16px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; color: blue; }
    </style>
</head>
<body>

    <h1>ทดสอบพิมพ์สลิปผ่าน Web Bluetooth<br>Succesfully via Web & Moblie(ผ่านกูเกิลเลนส์/โครม)</h1>
    
    <button id="connectBtn">1. ค้นหาและเชื่อมต่อเครื่องพิมพ์</button>
    <button id="printBtn" disabled>2. สั่งพิมพ์ข้อความทดสอบ</button>
    
    <div id="status">สถานะ: ยังไม่ได้เชื่อมต่อ</div>

    <script>

        // ตรวจสอบตั้งแต่ตอนโหลดหน้าเว็บว่าเครื่องรองรับบลูทูธหรือไม่
        if (!navigator.bluetooth) {
            let reason = "บราวเซอร์ของคุณไม่รองรับ Web Bluetooth";
            
            // เช็กว่าเกิดจากไม่ได้ใช้ HTTPS หรือไม่
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                reason += " (เนื่องจากคุณไม่ได้ใช้งานผ่านโปรโตคอล HTTPS)";
            }
            
            statusDiv.innerText = `⚠️ ข้อจำกัด: ${reason}`;
            statusDiv.style.color = "orange";
            connectBtn.disabled = true; // ปิดปุ่มกดค้นหาไปเลย
        }

        // กำหนดตัวแปรสำหรับเก็บค่าอุปกรณ์และท่อส่งข้อมูล
        let bluetoothDevice = null;
        let printCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const statusDiv = document.getElementById('status');

        // 1. ฟังก์ชันเชื่อมต่อ Bluetooth
connectBtn.addEventListener('click', async () => {
    statusDiv.innerText = "กำลังค้นหาอุปกรณ์...";
    try {
        // กำหนดรหัส UUID สำหรับรุ่น BLE (แก้จุดที่ 1)
        const BLE_SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455'; 
        // 💡 หมายเหตุ: ถ้าพิมพ์แล้วเงียบ ให้ลองเปลี่ยนเป็น '0000e1ff-0000-1000-8000-00805f9b34fb' ดูอีกทีครับ

        bluetoothDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'POS' }], 
            optionalServices: [BLE_SERVICE_UUID] // <-- แก้จุดที่ 1 ส่งไปให้บราวเซอร์รู้จัก
        });

        statusDiv.innerText = `กำลังเชื่อมต่อกับ: ${bluetoothDevice.name}...`;

        const server = await bluetoothDevice.gatt.connect();

        // เข้าถึง Service โดยใช้รหัส BLE เดียวกัน (แก้จุดที่ 2)
        const service = await server.getPrimaryService(BLE_SERVICE_UUID); // <-- แก้จุดที่ 2 

        const characteristics = await service.getCharacteristics();
        printCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

        if (printCharacteristic) {
            statusDiv.innerText = `เชื่อมต่อสำเร็จ: ${bluetoothDevice.name}`;
            statusDiv.style.color = "green";
            printBtn.disabled = false;
        } else {
            statusDiv.innerText = "ข้อผิดพลาด: ไม่พบช่องทางส่งข้อมูล (Characteristic)";
            statusDiv.style.color = "red";
        }

    } catch (error) {
        console.error(error);
        statusDiv.innerText = `เกิดข้อผิดพลาด: ${error.message}`;
        statusDiv.style.color = "red";
    }
});


        // 2. ฟังก์ชันสั่งพิมพ์ข้อมูล
        printBtn.addEventListener('click', async () => {
            if (!printCharacteristic) return;

            statusDiv.innerText = "กำลังส่งข้อมูลพิมพ์...";

            try {
                // สร้างคำสั่ง ESC/POS เบื้องต้นด้วยพาสเวิร์ด (Byte Array)
                const encoder = new TextEncoder('tis-620'); // ใช้ TIS-620 สำหรับภาษาไทยบนเครื่องพิมพ์สลิปทั่วไป
                
                // เตรียมข้อมูลชุดคำสั่งควบคุม (เทียบเท่าสคริปต์ Python ของคุณ)
                const initCmd = new Uint8Array([0x1b, 0x40]); // ESC @ (Initialize Printer)
                const textData = encoder.encode("ครัวจันทรเพ็ญ\nต้มยำรวมมิตร 120.-\n\n\n\n"); // ข้อความพิมพ์
                const cutCmd = new Uint8Array([0x1d, 0x56, 0x00]); // GS V 0 (ตัดกระดาษ)

                // รวมข้อมูลทั้งหมดเข้าด้วยกันก่อนส่ง
                const combinedData = new Uint8Array(initCmd.length + textData.length + cutCmd.length);
                combinedData.set(initCmd, 0);
                combinedData.set(textData, initCmd.length);
                combinedData.set(cutCmd, initCmd.length + textData.length);

                // ส่งข้อมูลไปยังเครื่องพิมพ์
                await printCharacteristic.writeValue(combinedData);
                statusDiv.innerText = "พิมพ์เสร็จสิ้น!";
                statusDiv.style.color = "green";

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `พิมพ์ล้มเหลว: ${error.message}`;
                statusDiv.style.color = "red";
            }
        });
    </script>
</body>
</html>
