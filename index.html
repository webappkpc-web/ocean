<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทะเลสีฟ้า · Blue Sea</title>
    <style>
        /* รีเซ็ตค่าเริ่มต้นและตั้งค่าฟอนต์ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0c4a6e;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ส่วนหัว */
        .hero {
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #075985;
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            display: inline-block;
            transform: translateY(4px);
        }

        .hero p {
            font-size: 1.2rem;
            color: #0369a1;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* กริดรูปภาพ */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            padding: 1rem 2rem 2rem;
        }

        .gallery-item {
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #fff;
            aspect-ratio: 4 / 3;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s;
        }

        .gallery-item:hover img {
            filter: brightness(1.05) saturate(1.1);
        }

        /* ส่วนท้าย */
        .footer {
            text-align: center;
            padding: 1.5rem 2rem 2rem;
            font-size: 0.9rem;
            color: #0c4a6e;
            border-top: 1px solid rgba(12, 74, 110, 0.1);
            margin-top: 0.5rem;
        }

        .footer a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dotted #0284c7;
        }

        .footer a:hover {
            color: #0c4a6e;
            border-bottom-style: solid;
        }

        /* การปรับขนาดหน้าจอเล็ก */
        @media (max-width: 600px) {
            body { padding: 0.75rem; }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .gallery { padding: 0.75rem 1rem 1.5rem; gap: 1rem; }
            .card { border-radius: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- ส่วนหัวข้อ -->
        <div class="hero">
            <h1>🌊 <span>ทะเล</span> 🌊</h1>
            <p>ความกว้างใหญ่ที่เงียบสงบ · คลื่นลมและแสงแดด</p>
        </div>

        <!-- แกลเลอรีรูปภาพ (ดึงจาก Unsplash ฟรี) -->
        <div class="gallery">
            <!-- รูปที่ 1: คลื่นทะเล -->
            <div class="gallery-item">
                <img 
                    src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=800&auto=format&fit=crop" 
                    alt="คลื่นทะเลสีฟ้า"
                    loading="lazy"
                >
            </div>
            <!-- รูปที่ 2: ชายหาดทรายขาว -->
            <div class="gallery-item">
                <img 
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=800&auto=format&fit=crop" 
                    alt="ชายหาดทรายขาวและน้ำทะเลใส"
                    loading="lazy"
                >
            </div>
            <!-- รูปที่ 3: พระอาทิตย์ตกทะเล -->
            <div class="gallery-item">
                <img 
                    src="https://images.unsplash.com/photo-1509233725247-49e657c54213?q=80&w=800&auto=format&fit=crop" 
                    alt="พระอาทิตย์ตกดินเหนือทะเล"
                    loading="lazy"
                >
            </div>
            <!-- รูปที่ 4: ผิวน้ำทะเล -->
            <div class="gallery-item">
                <img 
                    src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=800&auto=format&fit=crop" 
                    alt="พื้นผิวน้ำทะเลสีฟ้า"
                    loading="lazy"
                >
            </div>
        </div>

        <!-- เครดิต -->
        <div class="footer">
            รูปภาพทั้งหมดจัดหาโดย <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> · ใช้งานฟรี
        </div>
    </div>
</body>
</html>
