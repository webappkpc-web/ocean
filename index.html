<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งพิมพ์สลิป</title>
</head>
<body>

    <h1>หน้าจอขายหน้าร้าน</h1>
    
    <!-- สร้างปุ่มสำหรับกดสั่งพิมพ์ -->
    <button id="printBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        🖨️ พิมพ์ใบเสร็จ
    </button>

    <script>
        // 1. ระบุ IP ของคอมพิวเตอร์ที่เปิดรัน Node.js Server เอาไว้ (ห้ามใช้ localhost)
        const SERVER_IP = '192.168.1.73'; // ⚠️ เปลี่ยนเป็นเลข IPv4 ของคอมพิวเตอร์คุณจริงๆ
        const PRINT_URL = `http://${SERVER_IP}:3000/api/print`;

        // 2. จับเหตุการณ์เมื่อผู้ใช้คลิกปุ่ม
        document.getElementById('printBtn').addEventListener('click', () => {
            
            // ข้อความที่จะส่งไปพิมพ์
            const receiptData = {
                text: "--- ใบเสร็จรับเงิน ---\nร้านค้าตัวอย่าง\nวันที่: 19 ต.ค. 2026\n\nรายการสินค้า:\n- กาแฟสดอเมริกาโน่ x1  60 บ.\n- ชาเขียวนมสด   x1  65 บ.\n\nรวมทั้งสิ้น: 125 บาท\n--- ขอบคุณที่อุดหนุน ---"
            };

            // 3. ส่งคำสั่ง Fetch API ไปยัง Node.js Server ในวง Wi-Fi
            fetch(PRINT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(receiptData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('เครือข่ายตอบกลับไม่ถูกต้อง');
                }
                return response.json();
            })
            .then(result => {
                alert('สั่งพิมพ์ใบเสร็จสำเร็จ!');
                console.log('ข้อมูลจากเซิร์ฟเวอร์:', result);
            })
            .catch(error => {
                alert('พิมพ์ล้มเหลว! กรุณาเช็กว่าคอมพิวเตอร์เปิด Server หรือยัง และอยู่ใน Wi-Fi เดียวกันไหม');
                console.error('เกิดข้อผิดพลาด:', error);
            });
        });
    </script>

</body>
</html>
